# Opcional: PostgreSQL local en Docker si no lo tienes instalado.
#   docker compose up -d
# Luego abre AIRCTRL con host localhost, puerto 5432, base airctrl,
# usuario postgres y contrasena airctrl.
services:
  postgres:
    image: postgres:16
    container_name: airctrl-postgres
    environment:
      POSTGRES_DB: airctrl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: airctrl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - airctrl-data:/var/lib/postgresql/data
volumes:
  airctrl-data:
